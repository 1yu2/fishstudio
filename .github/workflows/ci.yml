name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 后端：lint + test（含真实 Postgres） ───────────────────────────
  backend:
    name: backend lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/fishstudio_test
      # 迁移 / 重试 / 多租户集成测试需要真实 PG，否则会被 skip
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/fishstudio_test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps（opencv / moviepy）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install Python deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # 固定版本：未固定时 ruff 升级会改变格式规则（0.17 起会格式化 Markdown 代码块）
          pip install ruff==0.15.20 coverage

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Pytest (with coverage)
        working-directory: backend
        run: |
          coverage run -m pytest -q
          coverage report -m
          coverage xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─── 前端：build + ts check ─────────────────────────────────────────
  frontend:
    name: frontend lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: TS check + build
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build

  # ─── Docker：buildx 构建（不推送，仅验证 Dockerfile 可用） ──────────
  docker-build:
    name: docker buildx (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          tags: fishstudio-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── 安全扫描（非阻塞，先 warn）─────────────────────────────────────
  security:
    name: security scan
    runs-on: ubuntu-latest
    needs: [backend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit (Python 安全静态分析)
        working-directory: backend
        run: bandit -r app/ -ll || true

  # 首轮观察 mock、浏览器和渲染环境的稳定性；稳定后移除 continue-on-error。
  e2e:
    name: browser e2e (mock)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishstudio_test_c2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/fishstudio_test_c2
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install system and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
          pip install -r backend/requirements.txt
      - name: Install frontend deps
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Install E2E deps and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload failed traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
